[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-tool-bench"
version = "0.1.0"
description = "Standardised function-calling benchmark for sub-2B language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "tiny-tool-bench contributors" }]
keywords = ["function-calling", "benchmark", "small-language-models", "bfcl"]

dependencies = [
    "torch==2.6.0",
    # transformers 5.x is required for LFM2.5 (>=4.55) and Gemma 4 E2B (>=5.0).
    # See memory/project_phase23_deps.md for the rationale.
    "transformers>=5.0.0",
    "accelerate>=0.34.0",       # required at runtime when transformers uses device_map="auto"
    "pandas==2.2.3",
    "tqdm==4.67.1",
    "pyyaml==6.0.2",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "sentencepiece>=0.2.0",     # FunctionGemma + Granite tokenisers (Phase 3)
    "einops>=0.8.0",            # LFM2.5 hybrid LIV-conv + GQA (Phase 3)
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
needle = [
    "jax>=0.4.30",
    # Cactus's Needle is GitHub-only (no PyPI publish as of 2026-05). Pinned to
    # commit 1c6fa9309f6d5b5b91738c9b6595ec7f709f5828 (main, 2026-05-16) so the
    # Phase 2 adapter API surface (``generate``, ``load_checkpoint``,
    # ``get_tokenizer``, ``SimpleAttentionNetwork``) is reproducibly fixed.
    "needle @ git+https://github.com/cactus-compute/needle.git@1c6fa9309f6d5b5b91738c9b6595ec7f709f5828",
]
gpu = ["bitsandbytes>=0.43.0"]  # INT4 Gemma 4 E2B on 8GB VRAM
report = ["matplotlib>=3.9.0"]

[project.scripts]
tiny-tool-bench = "scripts.run_one:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bench*", "scripts*"]
exclude = ["tests*", "data*", "results*", "configs*", "external*"]
